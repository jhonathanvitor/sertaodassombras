services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sertao_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-sertaodassombras}
      DB_USERNAME: ${DB_USERNAME:-sertao}
      DB_PASSWORD: ${DB_PASSWORD:-sertao_secret}
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sertao_net

  nginx:
    image: nginx:1.27-alpine
    container_name: sertao_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sertao_net

  db:
    image: mysql:8.4
    container_name: sertao_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sertaodassombras}
      MYSQL_USER: ${DB_USERNAME:-sertao}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sertao_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - sertao_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sertao_net

networks:
  sertao_net:
    driver: bridge

volumes:
  sertao_db_data:
